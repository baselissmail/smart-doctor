name: Release

# Push a tag like v0.2.0 (matching package.json) to build the binaries, create the GitHub
# release and publish to npm. See RELEASING.md for the one-time npm trusted-publishing setup.

on:
  push:
    # Full versions only: moving the Action's major tag (v0) must not start a release.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64 windows-x64
          - os: macos-latest
            targets: darwin-arm64 darwin-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # signs the build attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-binaries.mjs ${{ matrix.targets }}
      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: for f in dist/smart-doctor-darwin-*; do codesign --force --sign - "$f"; done
      - name: Smoke-test the native binary
        if: runner.os == 'Linux'
        run: scripts/binary-smoke.sh dist/smart-doctor-linux-x64
      - run: cd dist && shasum -a 256 smart-doctor-* > SHA256SUMS-${{ runner.os }}.txt
      - name: Attest where each binary came from (verify with gh attestation verify)
        id: attest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/smart-doctor-*
      - name: Attach the signed provenance to the release files
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/provenance-${{ runner.os }}.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ runner.os }}
          path: dist/*

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance; no npm token stored in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish unless this version is already on npm (the first release is published by hand)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "smart-doctor@$v" version >/dev/null 2>&1; then
            echo "smart-doctor@$v is already on npm; skipping."
          else
            npm publish --provenance --access public
          fi
